name: Deploy web companion

# Builds the published site from committed extraction outputs. Extraction itself
# is never run here — the Action consumes resources/dialogue/extracted as-is, so
# an extraction regression cannot break the deployed site.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'data-prep/**'
      - 'extraction/**'
      - 'resources/dialogue/extracted/**'
      - 'resources/maps/regions-trimmed-flat-by-name/**'
      - 'resources/maps/world-map.png'
      - 'resources/tables/**'
      - 'resources/labels/**'
      - 'resources/decompilations/**/SpriteGroups/**'
      - 'resources/decompilations/**/sprite_groups.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r data-prep/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      # data-prep emits web/public/{data,sprites,maps}; build-search runs after
      # so the MiniSearch index matches the client's version (it skips otherwise).
      - run: python data-prep/prep.py --out web/public
      - run: npm run build
        working-directory: web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
